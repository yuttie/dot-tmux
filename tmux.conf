unbind -a
source-file ~/.tmux.default.conf  # Generate it with: tmux -f /dev/null -L temp start-server \; list-keys \; kill-server > ~/.tmux.default.conf
unbind C-b
set -g prefix 'C-\'
bind \\ send-prefix


#
# Options
#

# Server options
set -s default-terminal     tmux-256color
set -s escape-time          10
set -s extended-keys        on
set -s extended-keys-format csi-u
set -s focus-events         on
set -s get-clipboard        request
set -s set-clipboard        on

# Window options
set -wg aggressive-resize on
set -wg window-size       latest
set -wg mode-keys         vi

# Session options
set -g history-limit      100000
set -g bell-action        any
set -g display-time       1000
set -g display-panes-time 2000
set -g base-index         1
set -g set-titles         on
set -g mouse              on
set -g lock-command       vlock


#
# Key bindings
#

# Unbind some default bindings
unbind-key Space

# reload this configuration file.
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# toggle last window like screen
bind C-\\ last-window

# change to the next/previous window.
bind C-n next-window
bind C-p previous-window

# Set the session working directory to that of current pane
bind C-w attach-session -c "#{pane_current_path}"

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind C-c new-window
bind C-s split-window -v
bind C-v split-window -h
bind S   switch-client -T fullVerticalSplitWindowTable
bind -T fullVerticalSplitWindowTable k split-window -fvb
bind -T fullVerticalSplitWindowTable j split-window -fv
bind V   switch-client -T fullHorizontalSplitWindowTable
bind -T fullHorizontalSplitWindowTable h split-window -fhb
bind -T fullHorizontalSplitWindowTable l split-window -fh
bind T   break-pane
bind x   confirm kill-pane
bind X   confirm kill-window

# move around panes with {,C-}{j,k,h,l}
bind j   select-pane -D
bind k   select-pane -U
bind h   select-pane -L
bind l   select-pane -R
bind C-j select-pane -D
bind C-k select-pane -U
bind C-h select-pane -L
bind C-l select-pane -R

# copy mode key bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi r send -X rectangle-toggle


#
# Statusbar
#
set -g status-interval 10

# default statusbar colors
set -g status-style fg=default,bg=default,default

# default window title colors
set -wg window-status-style fg=default,bg=default,default
set -wg window-status-format " #{window_index}:#{window_name} "

# active window title colors
set -wg window-status-current-style fg=black,bold,bg=cyan
set -wg window-status-current-format " #{window_index}:#{window_name} "

# Pane borders
set -wg pane-active-border-style fg=white,bg=default
set -wg pane-border-style fg=black,bright,bg=default

# command/message line colors
set -g message-style fg=black,bg=cyan

# contents to be displayed
set -g status-left-length  30
set -g status-right-length 60
set -g status-left         ' [#S@#h] '
set -g status-left-style   fg=cyan
set -g status-right        '#T '
set -g status-right-style  fg=cyan
